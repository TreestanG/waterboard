[project]
name = "waterboard-backend"
version = "0.1.0"
description = "Hydraulic simulation and leak-detection evaluation API for Waterboard"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "wntr==1.5.0",
    # WNTR imports six without declaring it.
    "six==1.17.0",
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx==0.28.1"]
